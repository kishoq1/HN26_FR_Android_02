[versions]
agp = "9.2.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"

roomRxjava3 = "2.6.1"
runtimeRxjava3 = "1.11.4"

rxandroid = "3.0.2"
rxjava = "3.1.12"
rxkotlin = "3.0.1"

materialIconsExtended = "<compose_version>"
